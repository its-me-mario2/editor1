function formatTime(s) {
  const m = Math.floor(s / 60);
  const sec = Math.floor(s % 60);
  const ms = Math.floor((s % 1) * 100);
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
}

function clamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

function createInitialTracks() {
  return [
    {
      id: 'track-video-1', kind: 'video', label: 'Video Track',
      clips: [
        { id: 'clip-1', type: 'video', trackId: 'track-video-1', label: 'Beach Sunset', startTime: 0, duration: 8, color: '#f59e0b', speed: 1, volume: 1, opacity: 1 },
        { id: 'clip-2', type: 'video', trackId: 'track-video-1', label: 'City Timelapse', startTime: 8, duration: 6, color: '#3b82f6', speed: 1, volume: 1, opacity: 1 },
        { id: 'clip-3', type: 'video', trackId: 'track-video-1', label: 'Mountain View', startTime: 14, duration: 7, color: '#10b981', speed: 1, volume: 1, opacity: 1 },
      ],
    },

        { id: 'clip-t1', type: 'text', trackId: 'track-text-1', label: 'Title', startTime: 1, duration: 4, text: 'Amazing View', fontSize: 32, fontColor: '#ffffff', bgColor: 'rgba(0,0,0,0.5)', fadeIn: 0.5, fadeOut: 0.5 },
        { id: 'clip-t2', type: 'text', trackId: 'track-text-1', label: 'Caption', startTime: 10, duration: 3, text: 'Nature is beautiful', fontSize: 24, fontColor: '#ffffff', bgColor: 'rgba(0,0,0,0.3)', fadeIn: 0.3, fadeOut: 0.3 },
      ],
    },
  ];
}

// ─── useTimeline Hook ──────────────────────────────────────────────
function useTimeline() {
  const [tracks, setTracks] = useState(createInitialTracks);
  const [currentTime, setCurrentTime] = useState(0);
  const [duration, setDuration] = useState(21);
  const [zoom, setZoom] = useState(80);
  const [selectedClipId, setSelectedClipId] = useState(null);
  const [isPlaying, setIsPlaying] = useState(false);
  const animFrameRef = useRef(null);

  useEffect(() => {
    if (isPlaying) {
      const startTime = performance.now();
      const startCurrent = currentTime;
      animFrameRef.current = requestAnimationFrame(function tick(now) {
        const elapsed = (now - startTime) / 1000;
        const next = startCurrent + elapsed;
        if (next >= duration) {
          setCurrentTime(duration);
          setIsPlaying(false);
          return;
        }
        setCurrentTime(next);
        animFrameRef.current = requestAnimationFrame(tick);
      });
    } else {
      if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current);
    }
    return () => { if (animFrameRef.current) cancelAnimationFrame(animFrameRef.current); };
  }, [isPlaying, duration]);

  const togglePlay = useCallback(() => {
    if (currentTime >= duration) setCurrentTime(0);
    setIsPlaying(p => !p);
  }, [currentTime, duration]);

  const seek = useCallback(t => setCurrentTime(clamp(t, 0, duration)), [duration]);
  const skipFrame = useCallback(dir => {
    setCurrentTime(t => clamp(t + dir * (1 / 30), 0, duration));
  }, [duration]);
  const selectClip = useCallback(id => setSelectedClipId(id), []);

  const getSelectedClip = useCallback(() => {
    if (!selectedClipId) return null;
    for (const t of tracks) {
      const found = t.clips.find(c => c.id === selectedClipId);
      if (found) return found;
    }
    return null;
  }, [tracks, selectedClipId]);

  const updateClip = useCallback((clipId, changes) => {
    setTracks(prev => prev.map(t => ({
      ...t, clips: t.clips.map(c => c.id === clipId ? { ...c, ...changes } : c),
    })));
  }, []);

  const splitClip = useCallback(() => {
    setTracks(prev => {
      const next = prev.map(t => ({ ...t, clips: [...t.clips] }));
      for (const track of next) {
        const idx = track.clips.findIndex(c =>
          c.id === selectedClipId || (c.startTime < currentTime && c.startTime + c.duration > currentTime)
        );
        if (idx === -1) continue;
        const clip = track.clips[idx];
        const splitPoint = currentTime - clip.startTime;
        if (splitPoint <= 0 || splitPoint >= clip.duration) continue;
        const rightClip = {
          ...clip,
          id: clip.id + '-split-' + Date.now(),
          startTime: currentTime,
          duration: clip.duration - splitPoint,
        };
        track.clips[idx] = { ...clip, duration: splitPoint };
        track.clips.splice(idx + 1, 0, rightClip);
        break;
      }
      return next;
    });
  }, [currentTime, selectedClipId]);

  const moveClip = useCallback((clipId, newStart) => {
    const maxTime = duration - 0.5;
    setTracks(prev => prev.map(t => ({
      ...t, clips: t.clips.map(c => c.id === clipId ? { ...c, startTime: clamp(newStart, 0, maxTime) } : c),
    })));
  }, [duration]);

  const trimClip = useCallback((clipId, edge, delta, initialValue, initialDuration) => {
    setTracks(prev => prev.map(t => ({
      ...t,
      clips: t.clips.map(c => {
        if (c.id !== clipId) return c;
        if (edge === 'left') {
          const newStart = clamp(initialValue + delta, 0, initialValue + initialDuration - 0.5);
          const newDur = clamp(initialDuration - delta, 0.5, initialDuration);
          return { ...c, startTime: newStart, duration: newDur };
        }
        const newDur = clamp(initialValue + delta, 0.5, 60);
        return { ...c, duration: newDur };
      }),
    })));
  }, []);

  const addClip = useCallback(clip => {
    setTracks(prev => prev.map(t => t.id === clip.trackId ? { ...t, clips: [...t.clips, clip] } : t));
  }, []);

  const deleteClip = useCallback(clipId => {
    setTracks(prev => prev.map(t => ({ ...t, clips: t.clips.filter(c => c.id !== clipId) })));
    setSelectedClipId(prev => prev === clipId ? null : prev);
  }, []);

  const timeToX = useCallback(t => t * zoom, [zoom]);
  const xToTime = useCallback(x => x / zoom, [zoom]);

  return {
    tracks, setTracks, currentTime, duration, zoom, setZoom,
    selectedClipId, isPlaying, togglePlay, seek, skipFrame,
    selectClip, getSelectedClip, updateClip, splitClip,
    moveClip, trimClip, addClip, deleteClip, timeToX, xToTime,
  };
}

// ─── Timeline Component ────────────────────────────────────────────
const CLIP_COLORS = {
  video: 'from-amber-500 to-orange-500',
  audio: 'from-violet-500 to-purple-500',
  text: 'from-emerald-500 to-teal-500',
};
const RULER_HEIGHT = 28;
const TRACK_HEIGHT = 56;
const TRACK_GAP = 6;

function TrackClip({ clip, zoom, isSelected, onSelect, onDragStart, onTrimStart, onDelete }) {
  const x = clip.startTime * zoom;
  const w = Math.max(clip.duration * zoom, 20);
  return React.createElement('div', {
    className: `absolute top-1.5 bottom-1.5 rounded-lg cursor-grab active:cursor-grabbing group select-none bg-gradient-to-r ${CLIP_COLORS[clip.type] || 'from-gray-500 to-gray-600'} ${isSelected ? 'ring-2 ring-white/80 ring-offset-1 ring-offset-surface-900 shadow-lg shadow-black/40' : 'opacity-85 shadow-md shadow-black/20'} hover:opacity-100 hover:shadow-xl hover:shadow-black/40 transition-all duration-150`,
    style: { left: x, width: w, minWidth: '24px' },
    onClick: e => { e.stopPropagation(); onSelect(); },
    onMouseDown: e => { if (e.button === 0 && !e.target.dataset.trim && !e.target.dataset.delete) onDragStart(e, clip.id); },
  },
    React.createElement('div', {
      'data-trim': 'left',
      className: 'absolute left-0 top-0 bottom-0 w-4 cursor-col-resize z-10 flex items-center justify-start pl-0.5',
      onMouseDown: e => { e.stopPropagation(); onTrimStart(e, clip.id, 'left'); },
    },
      React.createElement('div', { className: 'w-0.5 h-8 rounded-full bg-white/40 hover:bg-white/70 transition-colors' })
    ),
    React.createElement('div', {
      'data-trim': 'right',
      className: 'absolute right-0 top-0 bottom-0 w-4 cursor-col-resize z-10 flex items-center justify-end pr-0.5',
      onMouseDown: e => { e.stopPropagation(); onTrimStart(e, clip.id, 'right'); },
    },
      React.createElement('div', { className: 'w-0.5 h-8 rounded-full bg-white/40 hover:bg-white/70 transition-colors' })
    ),
    React.createElement('div', { className: 'flex items-center h-full px-3 gap-2 text-white text-2xs font-medium truncate' },
      clip.type === 'text'
        ? React.createElement('span', { className: 'shrink-0 text-[11px] italic' }, '\u201C')
        : React.createElement('span', { className: 'shrink-0 text-[11px]' },
            clip.type === 'video' ? '\u25B6' : '\u266B'
          ),
      React.createElement('span', { className: 'truncate drop-shadow-sm' }, clip.label),
      w > 40 && React.createElement('span', { className: 'shrink-0 ml-auto opacity-70 font-mono text-2xs bg-black/20 px-1 py-0.5 rounded' }, formatTime(clip.duration)),

      onClick: e => { e.stopPropagation(); onDelete(); },
    }, '\u2715')
  );
}

function TimelineRuler({ duration, zoom, currentTime, onSeek }) {
  const rulerRef = useRef(null);
  const [hoverTime, setHoverTime] = useState(null);
  const getTime = useCallback(e => {
    if (!rulerRef.current) return 0;
    return Math.max(0, (e.clientX - rulerRef.current.getBoundingClientRect().left) / zoom);
  }, [zoom]);
  const handleClick = useCallback(e => onSeek(getTime(e)), [getTime, onSeek]);
  const handleMove = useCallback(e => setHoverTime(getTime(e)), [getTime]);
  const majorInterval = zoom >= 150 ? 1 : zoom >= 60 ? 2 : 5;
  const minorInterval = majorInterval / 2;
  const ticks = [];
  for (let t = 0; t <= duration; t += minorInterval) {
    ticks.push({ time: t, isMajor: Math.abs(t % majorInterval) < 0.001 });
  }
  return React.createElement('div', {
    ref: rulerRef,
    className: 'relative h-full select-none',
    onClick: handleClick,
    onMouseMove: handleMove,
    onMouseLeave: () => setHoverTime(null),
  },
    ticks.map(({ time, isMajor }) =>
      React.createElement('div', {
        key: time,
        className: 'absolute top-0 flex flex-col items-center',
        style: { left: time * zoom },
      },
        React.createElement('div', { className: `${isMajor ? 'h-3 w-px bg-surface-400' : 'h-1.5 w-px bg-surface-600'}` }),
        isMajor && React.createElement('span', { className: 'text-2xs text-surface-400 mt-0.5' }, formatTime(time)),
      )
    ),
    hoverTime !== null && React.createElement('div', {
      className: 'absolute top-0 h-full w-px bg-white/20 z-10 pointer-events-none',
      style: { left: hoverTime * zoom },
    })
  );
}

function Timeline({
  tracks, currentTime, duration, zoom, selectedClipId, isPlaying,
  onSeek, onSelectClip, onMoveClip, onTrimClip, onSplitClip, onDeleteClip, onZoomChange,
  timeToX, xToTime,
}) {
  const containerRef = useRef(null);
  const [dragState, setDragState] = useState(null);

  const handleDragStart = useCallback((e, clipId) => {
    e.preventDefault();
    const clip = tracks.flatMap(t => t.clips).find(c => c.id === clipId);
    if (!clip) return;
    setDragState({ type: 'move', clipId, startX: e.clientX, initialValue: clip.startTime });
  }, [tracks]);

  const handleTrimStart = useCallback((e, clipId, edge) => {
    e.preventDefault();
    const clip = tracks.flatMap(t => t.clips).find(c => c.id === clipId);
    if (!clip) return;
    setDragState({
      type: 'trim', clipId, edge, startX: e.clientX,
      initialValue: edge === 'left' ? clip.startTime : clip.duration,
      initialDuration: clip.duration,
    });
  }, [tracks]);

  useEffect(() => {
    const handleMove = e => {
      if (!dragState) return;
      const delta = (e.clientX - dragState.startX) / zoom;
      if (dragState.type === 'move') onMoveClip(dragState.clipId, dragState.initialValue + delta);
      else if (dragState.type === 'trim') onTrimClip(dragState.clipId, dragState.edge, delta, dragState.initialValue, dragState.initialDuration);
    };
    const handleUp = () => setDragState(null);
    if (dragState) {
      document.addEventListener('mousemove', handleMove);
      document.addEventListener('mouseup', handleUp);
    }
    return () => {
      document.removeEventListener('mousemove', handleMove);
      document.removeEventListener('mouseup', handleUp);
    };
  }, [dragState, zoom, onMoveClip, onTrimClip]);

  const totalWidth = Math.max(duration * zoom + 100, 800);

  const handleTimelineClick = useCallback(e => {
    if (!containerRef.current) return;
    const rect = containerRef.current.getBoundingClientRect();
    const x = e.clientX - rect.left + containerRef.current.scrollLeft;
    onSeek(x / zoom);
    onSelectClip(null);
  }, [zoom, onSeek, onSelectClip]);

  return React.createElement('div', { className: 'flex flex-col bg-surface-900/95 border-t border-surface-700/80 select-none' },
    // Toolbar
    React.createElement('div', { className: 'flex items-center justify-between px-3 py-1.5 border-b border-surface-700/80 bg-surface-800/80' },
      React.createElement('div', { className: 'flex items-center gap-2' },
        React.createElement('span', { className: 'text-xs font-semibold text-surface-300' }, 'Timeline'),
        React.createElement('div', { className: 'w-px h-4 bg-surface-700' }),
        React.createElement('button', {
          onClick: onSplitClip,
          disabled: !selectedClipId,
          className: 'px-2.5 py-1 text-2xs font-medium bg-surface-700 hover:bg-surface-600 rounded-md text-surface-200 disabled:opacity-40 disabled:cursor-not-allowed transition-all hover:shadow-sm active:scale-95',
        }, 'Split'),
        React.createElement('span', { className: 'text-2xs text-surface-500' }, 'S'),
      ),
      React.createElement('div', { className: 'flex items-center gap-3' },
        React.createElement('span', { className: 'text-2xs font-mono text-surface-300 bg-surface-800 px-2 py-0.5 rounded ring-1 ring-surface-700/50' }, formatTime(currentTime)),
        React.createElement('div', { className: 'flex items-center gap-1.5' },
          React.createElement('button', {
            onClick: () => onZoomChange(Math.max(20, zoom - 20)),
            className: 'w-6 h-6 flex items-center justify-center text-xs bg-surface-700 hover:bg-surface-600 rounded-md text-surface-300 hover:text-white transition-all active:scale-90',
          }, '\u2212'),
          React.createElement('input', {
            type: 'range', min: 20, max: 300, step: 10, value: zoom,
            onChange: e => onZoomChange(Number(e.target.value)),
            className: 'w-20 h-1 accent-blue-500 cursor-pointer',
          }),
          React.createElement('button', {
            onClick: () => onZoomChange(Math.min(300, zoom + 20)),
            className: 'w-6 h-6 flex items-center justify-center text-xs bg-surface-700 hover:bg-surface-600 rounded-md text-surface-300 hover:text-white transition-all active:scale-90',
          }, '+'),
          React.createElement('span', { className: 'text-2xs text-surface-500 w-8 text-right' }, `${zoom}%`),
        ),
      ),
    ),
    // Body
    React.createElement('div', {
      ref: containerRef,
      className: 'overflow-x-auto overflow-y-auto relative',
      style: { maxHeight: '260px' },
      onClick: handleTimelineClick,
    },
      React.createElement('div', { style: { width: totalWidth } },
        React.createElement('div', { style: { height: RULER_HEIGHT }, className: 'bg-surface-900 border-b border-surface-700 sticky top-0 z-10' },
          React.createElement(TimelineRuler, { duration, zoom, currentTime, onSeek })
        ),
        tracks.map((track, idx) =>
          React.createElement('div', {
            key: track.id,
            className: 'relative',
            style: { height: TRACK_HEIGHT, marginTop: idx > 0 ? TRACK_GAP : 0 },
          },
            React.createElement('div', { className: 'absolute inset-0 bg-surface-900/80 border-b border-surface-800' }),
            React.createElement('div', { className: 'sticky left-0 top-0 bottom-0 w-24 flex items-center px-2 z-20 bg-surface-900/95 border-r border-surface-700 shadow-lg shadow-black/20' },
              React.createElement('div', { className: 'flex items-center gap-1.5' },
                React.createElement('span', { className: 'text-xs' },
                  track.kind === 'video' ? '\uD83C\uDFAC' : track.kind === 'audio' ? '\uD83C\uDFB5' : '\uD83D\uDCDD'
                ),
                React.createElement('span', { className: 'text-2xs text-surface-300 font-medium truncate' }, track.label),
              ),
            ),
            React.createElement('div', { className: 'absolute inset-0', style: { left: 96 } },
              track.clips.map(clip =>
                React.createElement(TrackClip, {
                  key: clip.id,
                  clip, zoom,
                  isSelected: selectedClipId === clip.id,

        React.createElement('div', { className: 'absolute inset-0 pointer-events-none shadow-inner' }),

        ASPECT_RATIOS.map(ar =>
          React.createElement('button', {

      const trackId = type === 'video' ? 'track-video-1' : 'track-audio-1';
      const track = tracks.find(t => t.id === trackId);
      const start = track && track.clips.length ? Math.max(...track.clips.map(c => c.startTime + c.duration)) : 0;
      onAddClip({
        id: 'clip-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
        type, trackId, label: file.name.replace(/\.[^/.]+$/, ''),
        startTime: start, duration: 5,
        color: type === 'video' ? '#3b82f6' : '#8b5cf6',
        volume: 1, speed: 1, opacity: 1,
      });
    }
    e.target.value = '';
  };

  const handleAddText = () => {
    if (!textInput.trim()) return;
    const track = tracks.find(t => t.kind === 'text');
    if (!track) return;
    const lastEnd = track.clips.length ? Math.max(...track.clips.map(c => c.startTime + c.duration)) : 0;
    onAddClip({
      id: 'text-' + Date.now(),
      type: 'text', trackId: track.id,
      label: textInput.trim().slice(0, 20),
      text: textInput.trim(),
      startTime: lastEnd, duration: 4,
      fontSize: 32, fontColor: '#ffffff',
      bgColor: 'rgba(0,0,0,0.5)',
      fadeIn: 0.5, fadeOut: 0.5,
    });
    setTextInput('');
  };

  function addStockVideo(name, color) {
    const trackId = 'track-video-1';
    const track = tracks.find(t => t.id === trackId);
    const start = track && track.clips.length ? Math.max(...track.clips.map(c => c.startTime + c.duration)) : 0;
    onAddClip({
      id: 'stock-' + Date.now(),
      type: 'video', trackId, label: name,
      startTime: start, duration: 5, color,
      volume: 1, speed: 1, opacity: 1,
    });
  }

  function addTextTemplate(t) {
    const track = tracks.find(t => t.kind === 'text');
    if (!track) return;
    const lastEnd = track.clips.length ? Math.max(...track.clips.map(c => c.startTime + c.duration)) : 0;
    onAddClip({
      id: 'text-' + Date.now(),
      type: 'text', trackId: track.id,
      label: t + ' Text',
      text: t + ' Text',
      startTime: lastEnd, duration: 4,
      fontSize: 32, fontColor: '#ffffff',
      bgColor: 'rgba(0,0,0,0.5)',
      fadeIn: 0.5, fadeOut: 0.5,
    });
  }

  const tabContent = () => {
    switch (activeTab) {
      case 'media':
        return React.createElement('div', { className: 'space-y-3' },
          React.createElement('button', {
            onClick: () => fileInputRef.current?.click(),
            className: 'w-full py-8 border-2 border-dashed border-surface-600 rounded-lg hover:border-blue-500 hover:bg-surface-800/50 transition-all group cursor-pointer',
          },
            React.createElement('div', { className: 'flex flex-col items-center gap-1' },
              React.createElement('span', { className: 'text-2xl text-surface-400 group-hover:text-blue-400 transition-colors' }, '\uD83D\uDCE4'),
              React.createElement('span', { className: 'text-xs text-surface-400 group-hover:text-surface-200' }, 'Upload Media'),
              React.createElement('span', { className: 'text-2xs text-surface-500' }, 'MP4, MOV, MP3, WAV'),
            ),
          ),
          React.createElement('input', { ref: fileInputRef, type: 'file', accept: 'video/*,audio/*', multiple: true, className: 'hidden', onChange: handleUpload }),
          React.createElement('div', { className: 'space-y-1' },
            React.createElement('span', { className: 'text-xs text-surface-400 font-medium' }, 'Stock Videos'),
            STOCK_VIDEOS.map((sv, i) =>
              React.createElement('div', {
                key: i,
                className: 'flex items-center gap-2 p-2 rounded-md bg-surface-800 hover:bg-surface-700 cursor-pointer transition-colors',
                onClick: () => addStockVideo(sv.name, sv.color),
              },
                React.createElement('div', {
                  className: 'w-10 h-10 rounded bg-gradient-to-br flex items-center justify-center text-white text-xs',
                  style: { background: `linear-gradient(135deg, ${sv.color}, ${sv.color}dd)` },
                }, '\uD83C\uDFAC'),
                React.createElement('div', { className: 'flex-1 min-w-0' },
                  React.createElement('div', { className: 'text-xs text-surface-200 truncate' }, sv.name),
                  React.createElement('div', { className: 'text-2xs text-surface-500' }, '00:05'),
                ),
                React.createElement('span', { className: 'text-surface-500 text-xs' }, '+'),
              )
            ),
          ),
        );
      case 'text':
        return React.createElement('div', { className: 'space-y-3' },
          React.createElement('div', { className: 'space-y-2' },
            React.createElement('label', { className: 'text-xs text-surface-400 font-medium' }, 'Add Text Overlay'),
            React.createElement('div', { className: 'flex gap-2' },
              React.createElement('input', {
                type: 'text', value: textInput,
                onChange: e => setTextInput(e.target.value),
                onKeyDown: e => e.key === 'Enter' && handleAddText(),
                placeholder: 'Enter text...',
                className: 'flex-1 px-3 py-1.5 bg-surface-800 border border-surface-600 rounded text-xs text-white placeholder-surface-500 focus:outline-none focus:border-blue-500',
              }),
              React.createElement('button', {
                onClick: handleAddText,
                disabled: !textInput.trim(),
                className: 'px-3 py-1.5 bg-blue-600 hover:bg-blue-500 disabled:bg-surface-700 disabled:text-surface-500 rounded text-xs font-medium transition-colors',
              }, 'Add'),
            ),
          ),
          React.createElement('div', { className: 'space-y-1' },
            React.createElement('span', { className: 'text-xs text-surface-400 font-medium' }, 'Templates'),
            TEXT_TEMPLATES.map((t, i) =>
              React.createElement('div', {
                key: i,
                className: 'flex items-center gap-2 p-2 rounded-md bg-surface-800 hover:bg-surface-700 cursor-pointer transition-colors',
                onClick: () => addTextTemplate(t),
              },
                React.createElement('div', { className: 'w-8 h-8 rounded bg-gradient-to-br from-emerald-500 to-teal-500 flex items-center justify-center text-white text-xs' }, 'T'),
                React.createElement('span', { className: 'text-xs text-surface-200' }, t),
              )
            ),
          ),
        );
      case 'transitions':
        return React.createElement('div', { className: 'space-y-1' },
          React.createElement('span', { className: 'text-xs text-surface-400 font-medium mb-2 block' }, 'Transitions'),
          React.createElement('div', { className: 'grid grid-cols-2 gap-2' },
            DEFAULT_TRANSITIONS.map(t =>
              React.createElement('div', {
                key: t.id,
                className: 'flex flex-col items-center gap-1 p-3 rounded-lg bg-surface-800 hover:bg-surface-700 cursor-pointer transition-colors group',
              },
                React.createElement('div', { className: 'w-full aspect-video rounded bg-surface-700 flex items-center justify-center text-xl text-surface-300 group-hover:text-blue-400 transition-colors' }, t.icon),
                React.createElement('span', { className: 'text-2xs text-surface-400' }, t.name),
              )
            ),
          ),
        );
      case 'stickers':
        return React.createElement('div', { className: 'space-y-1' },
          React.createElement('span', { className: 'text-xs text-surface-400 font-medium mb-2 block' }, 'Stickers'),
          React.createElement('div', { className: 'grid grid-cols-3 gap-2' },
            STICKERS.map(s =>
              React.createElement('div', {
                key: s.id,
                className: 'flex flex-col items-center gap-1 p-3 rounded-lg bg-surface-800 hover:bg-surface-700 cursor-pointer transition-colors group',
              },
                React.createElement('span', { className: 'text-2xl group-hover:scale-110 transition-transform' }, s.emoji),
                React.createElement('span', { className: 'text-2xs text-surface-400' }, s.name),
              )
            ),
          ),
        );
      case 'audio':
        return React.createElement('div', { className: 'space-y-3' },
          React.createElement('div', { className: 'space-y-1' },
            React.createElement('span', { className: 'text-xs text-surface-400 font-medium' }, 'Sound Effects'),
            AUDIO_EFFECTS.map(e =>
              React.createElement('div', {
                key: e.id,
                className: 'flex items-center gap-2 p-2 rounded-md bg-surface-800 hover:bg-surface-700 cursor-pointer transition-colors',
              },
                React.createElement('span', { className: 'text-sm text-surface-300' }, e.icon),
                React.createElement('span', { className: 'text-xs text-surface-200' }, e.name),
              )
            ),
          ),
        );
    }
  };

  return React.createElement('div', { className: 'flex flex-col h-full bg-surface-900/95 border-r border-surface-700/80' },
    React.createElement('div', { className: 'flex border-b border-surface-700/80 bg-surface-900' },
      SIDEBAR_TABS.map(tab =>
        React.createElement('button', {
          key: tab.id,
          onClick: () => onTabChange(tab.id),
          className: `flex-1 flex flex-col items-center py-2.5 text-2xs font-medium transition-all relative ${
            activeTab === tab.id
              ? 'text-blue-400 bg-surface-800/80'
              : 'text-surface-400 hover:text-surface-200 hover:bg-surface-800/30'
          }`,
        },
          React.createElement('span', { className: 'text-base leading-none mb-1' }, tab.icon),
          React.createElement('span', { className: 'leading-none' }, tab.label),
          activeTab === tab.id && React.createElement('div', { className: 'absolute bottom-0 left-2 right-2 h-0.5 bg-gradient-to-r from-blue-500 to-blue-400 rounded-full' }),
        )
      ),
    ),
    React.createElement('div', { className: 'flex-1 overflow-y-auto p-3 space-y-1' }, tabContent()),
  );
}

// ─── App Component ─────────────────────────────────────────────────
function App() {
  const [sidebarTab, setSidebarTab] = useState('media');
  const [showExport, setShowExport] = useState(false);
  const tl = useTimeline();

  useEffect(() => {
    const handleKey = e => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
      if (e.key.toLowerCase() === 's' && tl.selectedClipId) { e.preventDefault(); tl.splitClip(); }
      if (e.key === 'Delete' || e.key === 'Backspace') { if (tl.selectedClipId) { e.preventDefault(); tl.deleteClip(tl.selectedClipId); } }
    };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [tl.selectedClipId, tl.splitClip, tl.deleteClip]);

  const selectedClip = tl.getSelectedClip();

  return React.createElement('div', { className: 'h-screen w-screen flex flex-col bg-surface-950 text-white overflow-hidden' },
    React.createElement('header', { className: 'flex items-center justify-between px-4 py-2 bg-surface-900/95 backdrop-blur-sm border-b border-surface-700/80 shrink-0' },
      React.createElement('div', { className: 'flex items-center gap-3' },
        React.createElement('div', { className: 'flex items-center gap-2' },
          React.createElement('div', { className: 'w-7 h-7 rounded-lg bg-gradient-to-br from-blue-500 to-purple-600 flex items-center justify-center shadow-lg shadow-blue-600/20' },
            React.createElement('span', { className: 'text-xs font-bold text-white' }, 'C'),
          ),
          React.createElement('span', { className: 'text-sm font-bold bg-gradient-to-r from-blue-400 to-purple-400 bg-clip-text text-transparent' }, 'ClipForge'),
        ),
        React.createElement('span', { className: 'text-2xs text-surface-500 hidden sm:inline px-2 py-0.5 bg-surface-800 rounded-md' }, 'Beta'),
      ),
      React.createElement('div', { className: 'flex items-center gap-2' },
        React.createElement('div', { className: 'flex items-center gap-2 text-2xs text-surface-400 bg-surface-800/80 px-3 py-1.5 rounded-lg ring-1 ring-surface-700/50' },
          React.createElement('span', { className: 'text-surface-500' }, 'Ctrl+Z'),
          React.createElement('span', { className: 'text-surface-600' }, 'Undo'),
          React.createElement('span', { className: 'text-surface-600 mx-0.5' }, '|'),
          React.createElement('span', { className: 'text-surface-500' }, 'Ctrl+Shift+Z'),
          React.createElement('span', { className: 'text-surface-600' }, 'Redo'),
        ),
        React.createElement('button', {
          onClick: () => setShowExport(true),
          className: 'flex items-center gap-1.5 px-4 py-1.5 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-500 hover:to-purple-500 rounded-lg text-xs font-semibold text-white shadow-lg shadow-blue-600/20 transition-all hover:scale-105 active:scale-95 hover:shadow-xl hover:shadow-blue-600/30',
        },
          React.createElement('span', { className: 'text-sm leading-none' }, '\u2191'),
          ' Export',
        ),
      ),
    ),
    React.createElement('div', { className: 'flex-1 flex flex-col min-h-0' },
      React.createElement('div', { className: 'flex flex-1 min-h-0' },
        React.createElement('aside', { className: 'w-64 shrink-0 hidden md:flex flex-col' },
          React.createElement(Sidebar, {
            activeTab: sidebarTab,
            onTabChange: setSidebarTab,
            onAddText: (text, trackId) => {},
            onAddClip: tl.addClip,
            tracks: tl.tracks,
          }),
        ),
        React.createElement('main', { className: 'flex-1 flex flex-col min-w-0' },
          React.createElement(PreviewPlayer, {
            currentTime: tl.currentTime,
            duration: tl.duration,
            isPlaying: tl.isPlaying,
            selectedClip,
            tracks: tl.tracks,
            onTogglePlay: tl.togglePlay,
            onSeek: tl.seek,
            onSkipFrame: tl.skipFrame,
          }),
        ),
        React.createElement('aside', { className: 'w-64 shrink-0 hidden lg:flex flex-col' },
          React.createElement(PropertiesPanel, { clip: selectedClip, onUpdateClip: tl.updateClip }),
        ),
      ),
      React.createElement(Timeline, {
        tracks: tl.tracks,
        currentTime: tl.currentTime,
        duration: tl.duration,
        zoom: tl.zoom,
        selectedClipId: tl.selectedClipId,
        isPlaying: tl.isPlaying,
        onSeek: tl.seek,
        onSelectClip: tl.selectClip,
        onMoveClip: tl.moveClip,
        onTrimClip: tl.trimClip,
        onSplitClip: tl.splitClip,
        onDeleteClip: tl.deleteClip,
        onZoomChange: tl.setZoom,
        timeToX: tl.timeToX,
        xToTime: tl.xToTime,
      }),
    ),
    React.createElement('div', { className: 'md:hidden flex border-t border-surface-700 bg-surface-900' },
      ['media', 'text', 'transitions', 'stickers', 'audio'].map(tab =>
        React.createElement('button', {
          key: tab,
          onClick: () => setSidebarTab(tab),
          className: `flex-1 py-2 text-2xs font-medium transition-colors ${sidebarTab === tab ? 'text-blue-400 bg-surface-800' : 'text-surface-400'}`,
        }, tab.charAt(0).toUpperCase() + tab.slice(1))
      ),
    ),
    React.createElement(ExportModal, { isOpen: showExport, onClose: () => setShowExport(false) }),
  );
}

// ─── Mount ─────────────────────────────────────────────────────────
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
